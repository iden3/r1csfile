name: Continuous Integration

# Least privilege: no job needs write access to the repository.
permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*, lts/-1]

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # no job pushes: never persist the GITHUB_TOKEN into .git/config
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

      - name: Run tests
        run: npm test
